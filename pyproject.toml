[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-checker-agent"
version = "1.0.0"
description = "Production resume analysis with LangGraph, open-source models, ATS scoring, guardrails, and Hugging Face evals."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Raunak" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "email-validator>=2.1",
  "langchain>=0.3",
  "langchain-core>=0.3",
  "langgraph>=0.2",
  "pymupdf>=1.24",
  "scikit-learn>=1.4",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.17"]
email = ["sendgrid>=6.11"]
observability = ["langfuse>=2.50"]
ollama = ["langchain-ollama>=0.2"]
huggingface = ["langchain-huggingface>=0.1", "huggingface_hub>=0.24"]
eval = [
  "sentence-transformers>=3.0",
  "datasets>=2.20",
  "torch>=2.2",
]
semantic = ["sentence-transformers>=3.0"]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.5",
]

[project.scripts]
resume-checker = "resume_checker.cli:main"

[tool.setuptools.packages.find]
include = ["resume_checker*"]

[tool.setuptools.package-data]
resume_checker = ["evals/golden.json", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
