name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest
      - name: Golden eval gate
        run: resume-checker evaluate --dataset golden --output artifacts/golden.json
      - name: Hugging Face sample ranking
        run: resume-checker evaluate --dataset hf-sample --output artifacts/hf_sample.json
